:root {
  color-scheme: dark;
  /* Navy & Bullion: the KIN patch on a navy uniform; gold is thread for the brand only (top bar, emblem) */
  --ground: oklch(0.24 0.059 262);
  --panel: oklch(0.275 0.065 262);
  --panel-2: oklch(0.31 0.07 262);
  --rule: oklch(0.43 0.06 262);
  --rule-soft: oklch(0.35 0.055 262);
  --acetate: oklch(0.275 0.065 262 / 0.9);
  --bar-bg: oklch(0.24 0.059 262 / 0.94);
  --slot-bg: oklch(0.24 0.059 262 / 0.7);
  --ink: oklch(0.94 0.013 95);
  --ink-2: oklch(0.83 0.02 255);
  --ink-3: oklch(0.71 0.03 255);
  --gold: oklch(0.80 0.12 85);
  --gold-thread: oklch(0.80 0.12 85 / 0.55);
  --fr: oklch(0.86 0.095 215);
  --fr-fill: oklch(0.86 0.095 215 / 0.13);
  --ho: oklch(0.74 0.15 24);
  --gr: oklch(0.82 0.14 145);
  --un: oklch(0.91 0.14 103);
  --un-fill: oklch(0.91 0.14 103 / 0.11);
  --sans: Barlow, "Segoe UI", system-ui, sans-serif;
  --cond: "Barlow Semi Condensed", "Arial Narrow", Barlow, system-ui, sans-serif;
  --step: 90ms steps(2, end);
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--rule) var(--ground); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--ground) url(contours.svg) 0 0 / 1200px 900px;
  color: var(--ink); font: 500 17px/1.55 var(--sans); letter-spacing: .004em; font-variant-numeric: tabular-nums;
}
::selection { background: var(--fr); color: var(--ground); }
:focus-visible { outline: 2px solid var(--fr); outline-offset: 2px; }
a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--fr); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3 { font-family: var(--cond); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin: 0 0 14px; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.wrap { width: 100%; max-width: 1720px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px); }
.narrow { max-width: 920px; }

/* ---- bar ---- */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bar-bg); border-bottom: 1px solid var(--gold-thread); backdrop-filter: blur(6px); }
.bar .wrap { display: flex; align-items: center; gap: 24px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; }
.brand .emblem { display: block; flex: none; }
.mark { font: 700 15px/1 var(--cond); letter-spacing: .12em; color: var(--ground); background: var(--gold); border: 1.5px solid var(--gold); padding: 6px 7px 5px 9px; }
.brand span:last-child { font: 600 15px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.bar nav { display: flex; gap: 4px; flex-wrap: wrap; }
.bar nav a { font: 600 15px/1 var(--cond); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; color: var(--ink-2); padding: 9px 10px 8px; }
.bar nav a:hover, .bar nav a[aria-current] { color: var(--ink); background: var(--panel-2); }
.bar nav a.mine b { color: var(--fr); margin-left: 4px; }

main { flex: 1; padding: 28px 0 64px; }
.foot { border-top: 1px solid var(--rule-soft); color: var(--ink-3); font-size: 13px; }
.foot .wrap { padding-top: 14px; padding-bottom: 18px; }

/* ---- symbology ---- */
.sym { width: 48px; height: 38px; flex: none; overflow: visible; }
.sym rect { fill: var(--fr-fill); stroke: var(--fr); stroke-width: 2; }
.sym path { fill: none; stroke: var(--fr); stroke-width: 2; }
.sym .ech { fill: var(--fr); }
.sym.lg { width: 76px; height: 60px; }
.sym.sm { width: 34px; height: 27px; }
.ico { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.ico path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: square; }

/* ---- shared atoms ---- */
.tag { display: inline-block; font: 700 13px/1 var(--cond); letter-spacing: .1em; padding: 5px 7px 4px; border: 1px solid; text-transform: uppercase; }
.tag.draft { color: var(--un); background: var(--un-fill); border-style: dashed; }
.rid { display: inline-block; font: 700 13px/1 var(--cond); letter-spacing: .04em; color: var(--fr); border: 1px solid oklch(0.86 0.095 215 / 0.5); background: var(--fr-fill); padding: 5px 5px 4px; min-width: 24px; text-align: center; text-decoration: none; white-space: nowrap; }
button.rid:hover, a.rid:hover { background: oklch(0.86 0.095 215 / 0.26); }
button.rid[aria-pressed="true"] { background: var(--fr); color: var(--ground); }
.ref { display: inline-block; font: 600 13px/1 var(--cond); letter-spacing: .04em; color: var(--ink-2); border: 1px solid var(--rule); padding: 5px 5px 4px; text-decoration: none; }
.unk { color: var(--un); }
.crumb { font: 600 14px/1.4 var(--cond); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px; }
.crumb a { color: var(--ink-2); }
.block { margin-top: 36px; }
.lede { color: var(--ink-2); font-size: 18px; max-width: 62ch; }
.bullets li { position: relative; padding-left: 20px; max-width: 75ch; }
.bullets li + li { margin-top: 8px; }
.bullets li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 9px; height: 2px; background: var(--ink-3); }
.data { width: 100%; border-collapse: collapse; }
.data th { font: 600 13px/1.2 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding: 0 12px 8px 0; border-bottom: 1px solid var(--rule); }
.data td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
.data .num { text-align: right; white-space: nowrap; }
.data tfoot td { border-bottom: 0; border-top: 1px solid var(--rule); font-weight: 600; }

/* ---- strategy head + tabs ---- */
.strat-head { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.strat-head h1 { font-size: clamp(40px, 3vw + 22px, 72px); text-transform: uppercase; letter-spacing: .01em; }
.strat-head h1 span { color: var(--fr); }
.strat-head p { font: 600 16px/1.3 var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
.t-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; margin-top: 22px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tabs a { font: 600 16px/1 var(--cond); letter-spacing: .07em; text-transform: uppercase; text-decoration: none; color: var(--ink-3); padding: 12px 14px 11px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current] { color: var(--ink); background: var(--panel); box-shadow: inset 0 -2px 0 var(--fr); }

/* ---- plátno ---- */
.intent { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--rule-soft); }
.intent h2 { margin: 2px 0 0; }
.intent ul { columns: 2 380px; column-gap: 40px; }
.intent li { break-inside: avoid; margin-bottom: 8px; }
.tracebar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 52px; padding: 10px 0; color: var(--ink-3); font-size: 15px; }
.tracebar b { color: var(--fr); font-family: var(--cond); letter-spacing: .04em; }
.tracebar .act { font: 600 14px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px 7px; border: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.tracebar .act:hover { border-color: var(--fr); }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--acetate); }
.matrix { width: 100%; min-width: 1120px; border-collapse: collapse; table-layout: fixed; font-size: 16px; line-height: 1.5; }
.matrix col.ph { width: 240px; }
.matrix tbody th .pl { white-space: nowrap; }
.matrix thead th { text-align: left; vertical-align: top; padding: 14px 14px 12px; border-left: 1px solid var(--rule-soft); background: var(--panel-2); }
.matrix thead th:first-child { border-left: 0; font: 600 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.matrix thead a { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.matrix thead a b { display: block; font: 700 19px/1.05 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
.matrix thead a small { display: block; font: 600 12px/1.2 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.matrix thead a:hover b { color: var(--fr); }
.matrix tbody th { position: sticky; left: 0; z-index: 1; text-align: left; font-weight: 500; vertical-align: top; padding: 14px; background: var(--panel-2); border-right: 1px solid var(--rule); }
.matrix td { vertical-align: top; padding: 10px 14px 12px; border-left: 1px solid var(--rule-soft); }
.matrix tr.phase { border-top: 2px dashed oklch(0.71 0.03 255 / 0.55); }
.pl { display: inline; font: 700 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-right: .4em; }
.matrix tbody th b { display: inline; font: 700 20px/1.05 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.matrix tbody th time { display: block; font: 600 14px/1.2 var(--cond); letter-spacing: .04em; color: var(--fr); margin-top: 6px; }
.matrix tbody th p { font-size: 15px; color: var(--ink-2); margin-top: 8px; }
.entry { padding: 10px 0; transition: opacity var(--step); }
.entry + .entry { border-top: 1px solid var(--rule-soft); }
.entry .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.roster { margin-top: 12px; display: grid; gap: 3px; font: 500 14px/1.35 var(--sans); color: var(--ink-2); }
.roster b { display: inline-block; min-width: 3.6em; font: 700 13px/1 var(--cond); letter-spacing: .04em; color: var(--fr); }
.matrix td.quiet { color: var(--ink-2); vertical-align: middle; }
.matrix td.empty::after { content: ""; display: block; width: 14px; height: 2px; margin-top: 10px; background: var(--rule); }
.matrix.tracing .entry { opacity: .28; }
.matrix.tracing .entry.hit { opacity: 1; background: var(--fr-fill); box-shadow: 0 0 0 1px var(--fr); padding-left: 6px; padding-right: 6px; margin: 0 -6px; }
tr.sync td { padding: 9px 14px; border-left: 0; background: repeating-linear-gradient(-45deg, oklch(0.94 0.013 95 / 0.045) 0 6px, transparent 6px 12px); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-weight: 600; }
tr.sync .synctag { font: 700 13px/1 var(--cond); letter-spacing: .12em; border: 1px solid var(--ink-2); padding: 4px 6px 3px; margin-right: 12px; }

/* ---- situace / větve ---- */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 36px 56px; }
.side { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px; border: 2px solid; }
.side.friendly { border-color: var(--fr); background: var(--fr-fill); }
.side.red { border-color: var(--ho); background: oklch(0.74 0.15 24 / 0.2); transform: rotate(45deg) scale(.85); }
.side.green { border-color: var(--gr); background: oklch(0.82 0.14 145 / 0.18); transform: rotate(45deg) scale(.85); }
.side.mixed { border-color: var(--ink-3); border-style: dashed; }
.places dt { font: 700 20px/1.2 var(--cond); letter-spacing: .01em; }
.places dd { margin: 4px 0 18px; max-width: 70ch; }
.sector { display: grid; grid-template-columns: minmax(200px, auto) 1fr; gap: 4px 20px; padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
.sector b { font: 700 24px/1.05 var(--cond); letter-spacing: .03em; color: var(--ink); }
.sector span { color: var(--ink); }
.sector small { grid-column: 2; color: var(--ink-3); font-size: 14px; }
.budget { padding: 12px 0; border-bottom: 1px solid var(--rule-soft); }
.budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.budget-top b { font: 700 17px/1.2 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
.budget-top .num { font: 700 22px/1 var(--cond); }
.budget-top .num small { font-size: 15px; color: var(--ink-3); }
.budget .left { font-size: 14px; color: var(--ink-3); text-align: right; }
.budget .left.over { color: var(--ho); font-weight: 600; }
.budget ul { margin-top: 8px; font-size: 15px; color: var(--ink-2); }
.budget li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.budget li.own { color: var(--ink); font-weight: 600; }
.order { display: flex; flex-wrap: wrap; gap: 6px; counter-reset: o; }
.order li { counter-increment: o; display: flex; align-items: center; gap: 4px; }
.order li::before { content: counter(o); font: 600 12px/1 var(--cond); color: var(--ink-3); min-width: 1.4em; text-align: right; }
.links a { display: inline-flex; align-items: center; gap: 8px; margin: 0 18px 8px 0; }
.rx { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1.6fr); gap: 6px 14px; padding: 16px 0; border-bottom: 1px solid var(--rule-soft); }
.rx .when { font: 700 18px/1.25 var(--cond); letter-spacing: .01em; }
.rx .arrow { color: var(--ink-3); padding-top: 3px; }
.rx .then { color: var(--ink); }
.rx .who { grid-column: 3; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

/* ---- home ---- */
.home-head { display: grid; grid-template-columns: auto 1fr; gap: 6px 28px; align-items: center; }
.home-head .crest { grid-row: span 2; width: clamp(88px, 8vw + 40px, 150px); height: auto; }
.home-head h1 { font-size: clamp(44px, 4vw + 20px, 88px); text-transform: uppercase; letter-spacing: .005em; }
.home-head .lede { margin-top: 14px; }
.cont { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 28px; padding: 16px 18px; border: 1px solid var(--fr); background: var(--fr-fill); text-decoration: none; }
.cont .big { font: 700 34px/1 var(--cond); color: var(--fr); }
.cont span { font: 600 18px/1.2 var(--cond); text-transform: uppercase; letter-spacing: .04em; }
.cont small { display: block; color: var(--ink-2); font: 500 15px/1.3 var(--sans); text-transform: none; letter-spacing: 0; }
.home-ev { margin-top: 20px; }
.start .proc li { max-width: 80ch; }
.ros-head .lead { color: var(--ink-2); font: 600 15px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; }
.ros-head .lead b { color: var(--ink); text-transform: none; letter-spacing: 0; }
/* specs/akce-mapa-tym: the in-game team as a badge, its colour (--tc from content/tymy.toml) on the square and the
   border only; the name keeps the surrounding ink (Valkyra red as text on navy is under the DESIGN.md contrast) */
.team { display: inline-block; padding: .1em .3em 0; border: 1px solid var(--tc); white-space: nowrap; }
.team::before { content: ""; display: inline-block; width: .6em; height: .6em; margin-right: .3em; background: var(--tc); }
.sheets li a { display: grid; grid-template-columns: minmax(150px, auto) 1fr auto auto; gap: 18px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--rule-soft); text-decoration: none; }
.sheets li:first-child a { border-top: 1px solid var(--rule); }
.sheets b { font: 700 28px/1 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.sheets a:hover b { color: var(--fr); }
.sheets .meta { color: var(--ink-2); font: 600 16px/1.2 var(--cond); text-transform: uppercase; letter-spacing: .05em; }
.doklink { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font: 600 16px/1 var(--cond); text-transform: uppercase; letter-spacing: .06em; }
.picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); border: 1px solid var(--rule); background: var(--acetate); }
.pg { padding: 16px; border-right: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); }
.pg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pg-head b { display: block; font: 700 18px/1.05 var(--cond); text-transform: uppercase; }
.pg-head small { font: 600 12px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.pg li + li { margin-top: 2px; }
.pg button { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 7px 8px; }
.pg button:hover { background: var(--panel-2); }
.pg button .rid { min-width: 3.6em; text-align: center; }
.pg button.is-me { background: var(--fr-fill); box-shadow: inset 0 0 0 1px var(--fr); }

/* ---- squad / role ---- */
.unit-head, .role-head { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.unit-head h1 { font-size: clamp(36px, 2.4vw + 22px, 60px); text-transform: uppercase; }
.unit-head p, .role-head p { font: 600 16px/1.3 var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
.goal { font-size: 19px; max-width: 64ch; margin-top: 22px; }
.role-head .code { font: 700 clamp(56px, 6vw + 24px, 104px)/.85 var(--cond); color: var(--fr); letter-spacing: -.01em; }
.role-head h1 { font-size: clamp(30px, 1.6vw + 22px, 46px); }
.role-head .grow { flex: 1; min-width: 220px; }
.me-btn { font: 600 15px/1 var(--cond); letter-spacing: .07em; text-transform: uppercase; padding: 11px 14px 10px; border: 1px solid var(--fr); color: var(--fr); }
.me-btn:hover { background: var(--fr-fill); }
.me-btn[aria-pressed="true"] { background: var(--fr); color: var(--ground); }
.transport { font: 700 24px/1.2 var(--cond); letter-spacing: .01em; }
.unlocks { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 14px; font-size: 15px; color: var(--ink-2); }
.unlocks .ref { color: var(--ink); }
.howto summary { cursor: pointer; list-style: none; }
.howto summary::-webkit-details-marker { display: none; }
.howto summary h2 { display: inline-flex; align-items: center; gap: 8px; }
.howto summary .ico { color: var(--ink-3); transform: rotate(90deg); }
.howto[open] summary .ico { transform: rotate(-90deg); }
.howto .proc li::before { color: var(--ink-3); }
.gnote { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
.steps li { display: grid; grid-template-columns: 200px 1fr; gap: 4px 18px; padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
.steps li:first-child { border-top: 1px solid var(--rule); }
.steps .ph { padding-top: 3px; }
.steps .ph b { font: 700 18px/1.1 var(--cond); color: var(--ink); text-transform: uppercase; letter-spacing: .02em; }
.steps p { font-size: 18px; line-height: 1.5; }
.steps li.after .ph b { color: var(--fr); }
.dont li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.dont .ico { color: var(--ho); margin-top: 4px; }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--rule); font: 600 17px/1.2 var(--cond); letter-spacing: .02em; }
.pager a { text-decoration: none; color: var(--ink-2); }
.pager a:hover { color: var(--ink); }
.sq { padding: 18px 0; border-bottom: 1px solid var(--rule-soft); }
.sq h3 { display: flex; align-items: center; gap: 12px; font-size: 24px; text-transform: uppercase; margin-bottom: 10px; }
.sq p { color: var(--ink-2); max-width: 70ch; margin-bottom: 10px; }
.proc li { display: grid; grid-template-columns: 2.2em 1fr; padding: 8px 0; max-width: 75ch; }
.proc { counter-reset: p; }
.proc li::before { counter-increment: p; content: counter(p); font: 700 20px/1.1 var(--cond); color: var(--fr); }
.note { color: var(--ink-2); max-width: 75ch; margin-top: 14px; }
.drill { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 48px; max-width: 1280px; }
.drill a.pic { display: block; border: 1px solid var(--rule); }
.drill a.pic:hover { border-color: var(--fr); }
.drill img { display: block; width: 100%; height: auto; }
.drill .cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-top: 12px; }
.drill .cap b { font: 700 22px/1.1 var(--cond); letter-spacing: .02em; }
.drill .cap span { color: var(--ink-2); }
.drill .cap .dl { margin-left: auto; font: 600 15px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--fr); }

.item { width: 132px; height: 88px; flex: none; object-fit: contain; padding: 6px; border: 1px solid var(--rule);
  background: radial-gradient(ellipse at 50% 45%, oklch(0.54 0.03 255) 0%, oklch(0.39 0.04 258) 55%, oklch(0.27 0.045 262) 100%); }
.item.sm { width: 66px; height: 44px; padding: 3px; }
.item.none { display: inline-block; background: repeating-linear-gradient(-45deg, var(--rule-soft) 0 4px, transparent 4px 9px); }
.shop-sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 16px; }
.shop-sum > span { color: var(--ink-2); font-size: 15px; }
.shop-sum b { font: 700 28px/1 var(--cond); margin-right: 8px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 10px; }
.tile { display: flex; gap: 16px; align-items: flex-start; padding: 12px; background: var(--acetate); border: 1px solid var(--rule-soft); }
.tile.opt { border-style: dashed; }
.tile .tx { min-width: 0; }
.tile .nm { display: flex; gap: 10px; align-items: baseline; font: 700 21px/1.15 var(--cond); }
.tile .qty { font: 700 26px/1 var(--cond); color: var(--fr); min-width: 1.5em; }
.tile .pr { margin-top: 6px; font-size: 15px; color: var(--ink-2); }
.tile .pr b { color: var(--ink); font-weight: 600; }
.tile .nt { margin-top: 4px; font-size: 15px; color: var(--un); }
.tile .alt { display: flex; gap: 10px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); font-size: 15px; color: var(--ink-2); }
.tile .alt b { color: var(--ink); }
.rb { max-width: 1100px; padding: 18px 0 20px; border-bottom: 1px solid var(--rule-soft); }
.rb header { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.rb .rid.big { font-size: 18px; padding: 8px 9px 7px; }
.rb-t { flex: 1; min-width: 200px; }
.rb .rn { font: 700 23px/1.1 var(--cond); text-decoration: none; }
.rb .rn:hover { color: var(--fr); }
.rb p { color: var(--ink-2); font-size: 15px; margin-top: 2px; }
.rb-sum { text-align: right; font: 700 24px/1 var(--cond); }
.rb-sum small { display: block; margin-top: 4px; font: 500 14px/1.2 var(--sans); color: var(--ink-3); }
.strip { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.strip li { display: grid; grid-template-columns: 96px auto; gap: 2px 12px; align-items: center; padding: 6px 14px 6px 6px; background: var(--acetate); border: 1px solid var(--rule-soft); }
.strip li.opt { border-style: dashed; }
.strip .item { grid-row: 1 / 3; width: 96px; height: 64px; padding: 4px; }
.strip .q { font: 700 20px/1 var(--cond); color: var(--fr); align-self: end; }
.strip .n { font: 600 15px/1.2 var(--sans); align-self: start; }

.vbar { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; margin-top: 18px; }
.vlbl { align-self: center; margin-right: 6px; font: 700 14px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.vbar button { display: grid; gap: 3px; text-align: left; padding: 8px 14px 7px; border: 1px solid var(--rule); background: var(--acetate); }
.vbar button b { font: 700 18px/1 var(--cond); letter-spacing: .03em; text-transform: uppercase; }
.vbar button small { font: 500 13px/1.1 var(--sans); color: var(--ink-3); }
.vbar button:hover { border-color: var(--fr); }
.vbar button[aria-pressed="true"] { border-color: var(--fr); background: var(--fr-fill); box-shadow: inset 0 -3px 0 var(--fr); }
.vbar button[aria-pressed="true"] small { color: var(--ink-2); }
.vtag { display: inline-block; margin-left: 6px; font: 700 12px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--un); border: 1px dashed oklch(0.91 0.14 103 / 0.6); padding: 3px 5px 2px; vertical-align: 1px; }
.vpanel { display: grid; grid-template-columns: minmax(280px, 520px) 1fr; gap: 28px; align-items: start; padding: 22px 0; border-bottom: 1px solid var(--rule-soft); }
.vh { margin: 0; }
.vsum { font-size: 19px; margin-top: 10px; max-width: 70ch; }
.vtw { margin: 12px 0 18px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.vtx .bullets li { max-width: 78ch; }
.sketch { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }
.sketch .bg { fill: oklch(0.27 0.055 262); }
.sketch .z-forest { fill: oklch(0.36 0.06 255 / 0.75); }
.sketch .z-open { fill: oklch(0.42 0.045 258 / 0.45); }
.sketch .z-built { fill: oklch(0.58 0.03 255 / 0.32); stroke: oklch(0.74 0.03 255 / 0.35); stroke-width: 4; }
.sketch .z-hill { fill: oklch(0.52 0.04 255 / 0.22); stroke: oklch(0.76 0.03 255 / 0.45); stroke-width: 5; stroke-dasharray: 18 12; }
.sketch .river { fill: none; stroke: oklch(0.47 0.06 240); stroke-width: 30; stroke-linejoin: round; stroke-linecap: round; }
.sketch .cz { fill: none; stroke: var(--ink-3); stroke-width: 5; stroke-dasharray: 26 18; opacity: .7; }
.sketch .cz.on { fill: var(--fr-fill); stroke: var(--fr); stroke-width: 10; stroke-dasharray: none; opacity: 1; }
.sketch .czl { font: 700 64px var(--cond); fill: var(--fr); letter-spacing: 4px; text-transform: uppercase; }
.sketch .tw rect { fill: oklch(0.33 0.06 262); stroke: var(--ink-3); stroke-width: 7; }
.sketch .tw text { font: 700 60px var(--cond); fill: var(--ink-3); }
.sketch .tw.on rect { fill: var(--fr); stroke: var(--ground); }
.sketch .tw.on text { fill: var(--ground); }
.sketch .cross { stroke: var(--ink); stroke-width: 14; fill: none; }
.sketch .lbl { font: 600 58px var(--sans); fill: var(--ink); }
.sketch .lbl.fr { fill: var(--fr); }
.sketch .ap line { stroke-width: 16; }
.sketch .ap text { font: 700 60px var(--cond); letter-spacing: 2px; text-transform: uppercase; }
.sketch .ap.friendly line { stroke: var(--fr); } .sketch .ap.friendly path, .sketch .ap.friendly text { fill: var(--fr); }
.sketch .ap.red line { stroke: var(--ho); } .sketch .ap.red path, .sketch .ap.red text { fill: var(--ho); }
.sketch .ap.green line { stroke: var(--gr); } .sketch .ap.green path, .sketch .ap.green text { fill: var(--gr); }
.sketch .scale line { stroke: var(--ink); stroke-width: 10; }
.sketch .scale text, .sketch .north text { font: 700 54px var(--cond); fill: var(--ink-2); }
.sketch .north path { stroke: var(--ink-2); stroke-width: 10; fill: none; }

/* ---- loadout (vendor overview) ---- */
.loadout { margin-top: 28px; padding: 18px; background: var(--acetate); border: 1px solid var(--rule-soft); max-width: 1400px; }
.lo-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.lo-name { font-size: 30px; }
.lo-name a { text-decoration: none; }
.lo-head p { color: var(--ink-2); margin-top: 4px; max-width: 75ch; }
.lo-head .src { font-size: 15px; color: var(--ink-3); margin-top: 2px; }
.loadout h3 { font: 700 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 8px; }
.lo-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.slot { position: relative; display: flex; gap: 12px; align-items: center; min-height: 72px; padding: 8px; border: 1px solid var(--rule-soft); background: var(--slot-bg); }
.slot + .slot { margin-top: 6px; }
.slot.empty { background: repeating-linear-gradient(-45deg, var(--rule-soft) 0 2px, transparent 2px 10px); }
.slot .sl { position: absolute; top: 6px; left: 8px; font: 700 12px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.slot .item { width: 120px; height: 72px; }
.slot .sn { font: 700 19px/1.15 var(--cond); }
.slot .su { margin-left: auto; font: 600 13px/1 var(--cond); color: var(--un); white-space: nowrap; }
.slot .ph { font: 600 15px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 14px; }
.slot .pr, .lo-store .pr { font: 700 13px/1 var(--cond); letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
.slot .pr { position: absolute; top: 6px; right: 8px; }
.lo-store .pr { margin-left: 8px; }
.lo-gear { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.lo-gear .slot { flex-direction: column; align-items: flex-start; margin-top: 0; padding-top: 24px; }
.lo-gear .slot .item { width: 100%; }
.lo-gear .slot .su { margin-left: 0; }
.lo-store { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 6px; }
.lo-store li { display: grid; grid-template-columns: 66px auto; gap: 0 10px; align-items: center; padding: 4px 10px 4px 4px; border: 1px solid var(--rule-soft); }
.lo-store .item { grid-row: 1 / 3; }
.lo-store .q { font: 700 18px/1 var(--cond); color: var(--fr); align-self: end; }
.lo-store .n { font-size: 15px; line-height: 1.2; align-self: start; }
.lo-quick { display: flex; flex-wrap: wrap; gap: 6px; }
.lo-quick li { display: flex; gap: 6px; align-items: center; font-size: 15px; padding: 4px 8px; border: 1px solid var(--rule-soft); }
.lo-quick .kb { font: 700 13px/1 var(--cond); color: var(--ground); background: var(--ink-2); padding: 3px 5px; }
.lo-sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
.lo-sum > span { color: var(--ink-2); font-size: 15px; }
.lo-sum b { font: 700 26px/1 var(--cond); margin-right: 8px; }
.cls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; margin-top: 14px; }
.cls a { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--rule-soft); background: var(--acetate); text-decoration: none; }
.cls a:hover { border-color: var(--fr); }
.cls b { font: 700 20px/1.1 var(--cond); }
.cls span { font-size: 15px; color: var(--ink-2); }
@media (max-width: 720px) { .lo-grid { grid-template-columns: 1fr; } .lo-gear { grid-template-columns: repeat(2, minmax(0, 1fr)); } .slot .item { width: 88px; height: 56px; } }

/* ---- sestava ---- */
.sestava { margin-top: 36px; }
.hist-h { margin-top: 40px; }
.ros-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 14px; }
.ros-head h2 { margin: 0; }
.ros-head .num { font: 700 22px/1 var(--cond); }
.ros-head .num small { font-size: 15px; color: var(--ink-3); }
.ros-head time { color: var(--ink-2); }
.ros { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); border: 1px solid var(--rule); background: var(--acetate); }
.rg { padding: 14px 16px; border-right: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); min-width: 0; }
.rg .pg-head .num { margin-left: auto; font: 700 18px/1 var(--cond); color: var(--ink-2); }
.rg li { display: flex; align-items: center; }
.rg li + li { margin-top: 2px; }
.rslot { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; min-height: 38px; text-align: left; padding: 6px 8px; }
.rslot:not([disabled]):hover { background: var(--panel-2); }
.rslot[disabled] { cursor: default; }
.rslot .lbl { flex: 1 1 9em; min-width: 7em; color: var(--ink-2); }
.rslot .lbl .rid { margin-right: 8px; }
.rslot .nm { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; max-width: 11em; }  /* long nicks wrap, never cut (Petr 2026-10-18) */
.ros.swarm .rslot .lbl { flex: 0 0 auto; min-width: 2em; }  /* SWARM labels are "1" or "Střelec": the nick gets the room */
.ros.swarm .rslot .nm { flex: 1; max-width: none; }
.rslot .free { font: 600 13px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); border: 1px dashed var(--rule); padding: 5px 7px 4px; }
.rg li.is-me .rslot { background: var(--fr-fill); box-shadow: inset 0 0 0 1px var(--fr); }
/* SWARM squad (specs/swarm-squady): the fixed core on a solid bracket, the Swarm body on a dashed one (Dashed Outline
   Rule: not fixed) with the Commander's + / - beside its count; SL is a badge on a person, bone like the key chip, never gold */
.sqc .veli { display: block; margin-top: 5px; font: 500 14px/1.3 var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink-2); }
.sqc .veli .who { font-weight: 600; color: var(--ink); }
.sqc .veli.none { color: var(--ho); }
.sqp { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; font: 700 12px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.sqp b { font-size: 15px; color: var(--ink); }
.swctl { display: flex; gap: 6px; margin-left: auto; }
.swctl .act { min-height: 44px; min-width: 44px; letter-spacing: .04em; }
.swctl .act:disabled { color: var(--ink-3); border-style: dashed; cursor: default; }
.swctl .act:disabled:hover { border-color: var(--rule); }
.why { margin: 2px 0 6px; font: 500 14px/1.3 var(--sans); color: var(--ink-3); text-align: right; }
.sqc ul { padding-left: 8px; border-left: 2px solid var(--ink-3); }
.sqc ul.body { border-left-style: dashed; }
.ros.swarm .rslot, .ros.swarm .kick { min-height: 44px; }
.ros.swarm .kick { min-width: 44px; }
.ros.swarm { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }  /* label, avatar, nick, SL badge and the kick in one row */
.sqc li { flex-wrap: wrap; }
.ros.swarm .sqc .rslot .lbl { flex: 0 0 5em; min-width: 0; }  /* names line up under each other */
.ros.swarm .sqc .rslot .nm { flex: 0 1 auto; }  /* the SL badge right after the name */
.sqc li.is-me .rslot { flex-basis: 100%; }  /* "Povedu squad" / "Předat SL" under my name: in a 300 px column the nick keeps its room */
.slb { flex: none; font: 700 13px/1 var(--cond); letter-spacing: .06em; color: var(--ground); background: var(--ink); padding: 4px 5px 3px; }
.rg li .lead { flex: none; min-height: 44px; margin: 4px 0 2px auto; }
/* SWARM Podpora (specs/swarm-squady P3): a vehicle frames its crew in a hairline box headed by its unit symbol, so the
   seats read as one crew; Podpora spans the grid and on a wide screen the vehicle types stand side by side */
.podc { grid-column: 1 / -1; }
.vtypes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 0 24px; align-items: start; }
.podc .sqp { flex-wrap: wrap; row-gap: 4px; }
.podc .swctl .act { white-space: nowrap; }  /* on a phone "+ Combat heli" goes under the type, not over two lines */
.veh { margin: 8px 0 10px; padding: 0 8px 6px; border: 1px solid var(--rule); }
.vh { display: flex; align-items: center; gap: 8px; padding: 8px 0 6px; margin-bottom: 4px; border-bottom: 1px solid var(--rule-soft); }
.vh .vn { font: 700 16px/1 var(--cond); letter-spacing: .04em; text-transform: uppercase; }
.vh .num { margin-left: auto; font: 700 15px/1 var(--cond); color: var(--ink-2); }
.podc li { flex-wrap: wrap; }
.ros.swarm .podc .rslot .lbl { flex: 0 0 5.5em; min-width: 0; }  /* seats line up; "2. člen posádky" wraps */
.kick { padding: 8px; color: var(--ink-3); }
.kick:hover { color: var(--ho); }
.ros-msg { position: sticky; top: 60px; z-index: 4; margin-top: 12px; padding: 8px 10px; background: var(--ground); border: 1px solid var(--ho); }  /* sticky: errors from slots low in the grid and the close form stay on screen */
.evf { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
.evf .note { flex: 1 1 100%; max-width: none; margin: 0; }  /* a full row: else the fields sit beside it */
.evf label { display: grid; gap: 6px; font: 600 13px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.evf label.wide { flex: 1 1 28ch; }
.evf input, .evf select, .evf textarea { font: 500 16px/1.3 var(--sans); color: var(--ink); background: var(--panel-2); border: 1px solid var(--rule); padding: 7px 8px; }
.evclose, .evmap { margin: 0 0 8px; }
#evbar a { display: block; margin: 10px 0 0; padding: 9px 12px; border: 1px solid var(--ho); color: var(--ink); font: 600 15px/1.3 var(--cond); letter-spacing: .04em; text-decoration: none; }
#evbar a b { color: var(--ho); }
.evcancel { margin: 0 0 12px; }
.evclose summary, .evmap summary, .evcancel summary { display: inline-block; cursor: pointer; font: 600 14px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; padding: 8px 10px 7px; border: 1px solid var(--rule); }
.evclose summary:hover, .evmap summary:hover { border-color: var(--fr); }
.evcancel summary:hover { border-color: var(--ho); }
.evclose[open] form, .evmap[open] form { margin-top: 12px; }
.evcancel[open] .note { margin: 10px 0 8px; }
.miss { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: -4px 0 12px; font: 600 15px/1 var(--cond); letter-spacing: .04em; color: var(--ho); }
.miss.ok { color: var(--fr); }
.miss.warn { padding: 8px 10px; border: 1px solid var(--ho); background: oklch(0.74 0.15 24 / 0.12); line-height: 1.3; }  /* Viktor #008: colour alone was easy to miss */
