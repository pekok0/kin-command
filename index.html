.op-me .rsvp .act[aria-pressed="true"] { position: relative; z-index: 1; color: var(--ground); background: linear-gradient(180deg, oklch(0.92 0.13 205), oklch(0.8 0.15 210)); box-shadow: 0 0 0 1px var(--fr), 0 0 20px -4px var(--fr-glow); }
.op-me .rsvp .rc { flex-basis: 100%; margin: 6px 0 0; text-align: right; font-size: 14px; }
.op-me .rsvp-hint, .op-me .rsvp-who { flex-basis: 100%; margin: 0; }
/* the Commander's commands: one toolbar; an opened form takes the whole row under it */
.op-cmd { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule-soft); }

  border: 1px solid var(--rule); background: linear-gradient(180deg, oklch(0.25 0.05 245 / 0.9), oklch(0.18 0.04 252 / 0.9)); box-shadow: inset 0 1px 0 oklch(0.86 0.15 205 / 0.18); }
.op-cmd > details[open] { flex-basis: 100%; order: 9; padding: 12px; background: oklch(0.13 0.03 254 / 0.6); box-shadow: inset 0 0 0 1px var(--rule-soft); }

@media (max-width: 720px) {

@media (prefers-reduced-motion: reduce) { .op-lamp, .op-status .miss::before { animation: none; } }

/* trainings and courses (specs/typy-akci) in the war room: a plate each, side by side on a wide screen */

.tr details summary, .trnew summary { display: inline-flex; align-items: center; min-height: 40px; margin-top: 10px; padding: 10px 14px 9px; font: 600 14px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  border: 1px solid var(--rule); background: linear-gradient(180deg, oklch(0.25 0.05 245 / 0.9), oklch(0.18 0.04 252 / 0.9)); box-shadow: inset 0 1px 0 oklch(0.86 0.15 205 / 0.18); }
.tr details summary { color: var(--ink-3); }

/* change marks (app.js markChanges): one authored move per kind, from an already visible state */
.rg li, .veh { position: relative; }
li.fx-claim .rslot { animation: fx-lock 900ms var(--ease); }
li.fx-claim::after, .veh.fx-new::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 20%, oklch(0.86 0.15 205 / 0.45) 50%, transparent 80%); background-size: 250% 100%;
  animation: fx-scan 700ms var(--ease) forwards; }
@keyframes fx-lock { 0% { box-shadow: inset 0 0 0 2px var(--fr), 0 0 34px 2px var(--fr-glow); } 100% { box-shadow: inset 0 0 0 1px transparent; } }
@keyframes fx-scan { from { background-position: 120% 0; opacity: 1; } to { background-position: -30% 0; opacity: 0; } }
li.fx-free .rslot { animation: fx-free 600ms steps(6, end); }
@keyframes fx-free { 0% { box-shadow: inset 0 0 0 1px var(--ho); background: oklch(0.72 0.19 25 / 0.18); clip-path: inset(0); }
  30% { clip-path: inset(0 0 40% 0); transform: translateX(3px); } 60% { clip-path: inset(30% 0 0 0); transform: translateX(-2px); }
  100% { box-shadow: inset 0 0 0 1px transparent; background: transparent; clip-path: inset(0); transform: none; } }
li.fx-new { animation: fx-unfold 520ms var(--ease) both; }
@keyframes fx-unfold { from { clip-path: inset(0 0 100% 0); transform: translateY(-6px); } to { clip-path: inset(0); transform: none; } }
.veh.fx-new { animation: fx-deploy 700ms var(--ease) both; }
@keyframes fx-deploy { from { transform: scale(0.94); filter: brightness(1.9); box-shadow: inset 0 0 0 2px var(--fr), 0 0 40px 4px var(--fr-glow); } to { transform: none; filter: none; } }
.slb.fx-lead { animation: fx-stamp 650ms var(--ease) both; }
@keyframes fx-stamp { 0% { transform: scale(2.4) rotate(-10deg); opacity: 0; }
  55% { transform: scale(0.9); opacity: 1; box-shadow: 0 0 0 6px oklch(0.86 0.15 205 / 0.35), 0 0 30px var(--fr-glow); } 100% { transform: none; } }

/* every page arrives once: the content rises off the floor */
#app > * { animation: rise 420ms var(--ease) both; }
#app > *:nth-child(2) { animation-delay: 40ms; }
#app > *:nth-child(3) { animation-delay: 80ms; }

@media (prefers-reduced-motion: reduce) {

}

/* Lobby v2 (Petr 2026-10-28: "lip pracovat s prostorem ... mega dobry UX"): one line per place, the Commander's controls

.ro-RF, .ro-SW { --rc: var(--r-RF); } .ro-MK, .ro-AA { --rc: var(--r-MK); } .ro-RK, .ro-AT { --rc: var(--r-RK); } .ro-GR { --rc: var(--r-GR); }

.slplate.fx-lead { animation: sl-seat 900ms var(--ease) both; }
